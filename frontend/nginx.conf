server {
    listen 80;
    root /usr/share/nginx/html;

    # Фото с камеры смартфона обычно заметно больше загруженного с ПК файла.
    # Небольшой запас нужен также для служебных данных multipart/form-data.
    client_max_body_size 25m;

    # Service Worker и HTML-оболочка всегда проверяются заново, чтобы
    # установленное PWA сразу получало ссылки на свежие hashed-ассеты.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}
