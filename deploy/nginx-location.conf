# Добавьте только эти location внутрь существующего
# server {} для kvasmix.ru. Завершающие `/` в proxy_pass нужны:
# они убирают внешний prefix перед передачей запроса в web-контейнер.
location = /vr/finomir { return 301 /vr/finomir/; }
location /vr/finomir/api/ {
    client_max_body_size 20m;
    proxy_pass http://127.0.0.1:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /vr/finomir/ {
    proxy_pass http://127.0.0.1:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
