services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 10s, timeout: 5s, retries: 5}
    restart: unless-stopped
  backend:
    build: ./backend
    env_file: .env
    volumes: [uploads:/app/data/uploads]
    depends_on: {postgres: {condition: service_healthy}}
    healthcheck: {test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"], interval: 15s, timeout: 5s, retries: 5}
    restart: unless-stopped
  frontend:
    build: {context: ./frontend, args: {VITE_BASE_PATH: "${VITE_BASE_PATH:-/}"}}
    ports: ["127.0.0.1:8080:80"]
    depends_on: {backend: {condition: service_healthy}}
    restart: unless-stopped
volumes: {postgres_data: {}, uploads: {}}
